# Keep the default rules, and allow exactly one known-public value.
title = "Soycatory secret scan"

[extend]
useDefault = true

# A Supabase publishable key is meant to be public: in the Idea Room it can only call ten checked
# functions and cannot read or change a table. The rule needs BOTH the file and the value to match,
# so a real secret anywhere else, or in this file, is still caught.
[[allowlists]]
description = "Idea Room publishable key (public by design)"
condition = "AND"
paths = ['''apps/2026-11-20-idea-room/config\.js''']
regexes = ['''sb_publishable_[A-Za-z0-9_-]+''']
